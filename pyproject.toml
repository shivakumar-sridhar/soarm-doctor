[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soarm-doctor"
version = "0.6.0"
description = "Health check for SO-100 / SO-101 robot arms — finds the bad servo, cable or power supply before you train on it."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "shivakumar-sridhar" }]
keywords = [
    "robotics",
    "so-100",
    "so-101",
    "so-arm100",
    "lerobot",
    "feetech",
    "sts3215",
    "diagnostics",
    "servo",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
dependencies = [
    "feetech-servo-sdk>=1.0.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
# Live 3D view of the arm during the motion sweep. Rerun 0.24+ has a built-in
# URDF loader; 0.28+ for the explicit named frame ids this uses.
viz = [
    "rerun-sdk>=0.28",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
soarm = "soarm_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/shivakumar-sridhar/soarm-doctor"
Issues = "https://github.com/shivakumar-sridhar/soarm-doctor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/soarm_doctor"]

# The README's screenshots are served from GitHub by absolute URL, so shipping
# them would put ~800 kB of PNG in every sdist for nothing. .claude/ is one
# machine's tool permissions and has no business in a public artifact.
[tool.hatch.build.targets.sdist]
exclude = ["docs/", ".claude/", "dist/"]

[tool.ruff]
line-length = 119
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
